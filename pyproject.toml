[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spyglass-lite"
dynamic = ["version"]
description = "Importable OSINT recon — username, email, IP, ASN and phone, with no external binaries and no API keys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Atheer" }]
keywords = [
    "osint", "recon", "reconnaissance", "username", "email",
    "enumeration", "security", "footprint",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet",
    "Typing :: Typed",
]

# httpx: async HTTP with connection pooling and proxy support.
# dnspython: MX / SPF / DMARC. The stdlib socket module cannot query anything
# that is not an A/AAAA record, so this is not optional for the email module.
#
# dnspython 2.9.0 fixes CVE-2026-114605 (GHSA-45c3-73f7-pv4m, 7.5) but requires
# Python 3.11. 3.10 reached end of life in October 2026 and cannot be patched;
# the gap is recorded in docs/AUDIT.md rather than silently left open.
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.9.0; python_version >= '3.11'",
    "dnspython>=2.6,<2.9; python_version < '3.11'",
]

[project.optional-dependencies]
phone = ["phonenumbers>=8.13"]
socks = ["httpx[socks]>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Ahmad170412/spyglass-lite"
Source = "https://github.com/Ahmad170412/spyglass-lite"
Changelog = "https://github.com/Ahmad170412/spyglass-lite/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ahmad170412/spyglass-lite/issues"

[tool.hatch.version]
path = "src/spyglass_lite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spyglass_lite"]

[tool.hatch.build.targets.sdist]
include = [
    "src/spyglass_lite",
    "tests",
    "bench",
    "docs",
    "scripts",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    "bench/.cache",
    "bench/results/raw.json",
    "bench/results/run.log",
    "**/__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:spyglass_lite.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "bench", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/spyglass_lite"]
