name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,phone]"

      - name: Lint
        run: ruff check src tests bench scripts

      - name: Format check
        run: ruff format --check src tests bench scripts

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Build
        run: python -m build

      - name: Check the wheel contains its data
        shell: bash
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for required in ("data/sites.json.gz", "data/registrations.json", "py.typed"):
              assert any(name.endswith(required) for name in names), required
          print(wheel, "ok")
          PY

  no-network-import:
    name: package has no shell or network at import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_no_subprocess.py
